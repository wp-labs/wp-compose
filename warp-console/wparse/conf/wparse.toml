version = "1.0"

[models]
wpl = "./models/wpl"
oml = "./models/oml"

[topology]
sources = "./topology/sources"
sinks = "./topology/sinks"

[performance]
parse_workers = 2
rate_limit_rps =  0

[rescue]
path = "./data/rescue"

[log_conf]
level = "info"
output = "Console"
[log_conf.file]
path = "./data/logs"


[admin_api]
enabled = true
bind = "0.0.0.0:19090"
request_timeout_ms = 15000
max_body_bytes = 4096

[admin_api.auth]
mode = "bearer_token"
token_file = "/root/.warp_parse/admin_api.token"

[admin_api.tls]
enabled = false

[project_remote]
enabled = true
repo = "http://gitea:3000/gitea/project_root.git"
init_version = "1.0.0"
